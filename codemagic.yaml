workflows:
  ios-unsigned:
    name: iOS Unsigned Build (for Sideloadly / AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign
      - name: Package into IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r toidym-unsigned.ipa Payload
    artifacts:
      - toidym-unsigned.ipa
      - build/ios/iphoneos/Runner.app

  ios-app-store:
    name: iOS App Store / TestFlight (requires Apple Developer Program)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: codemagic_api_key # Codemagic-те бапталған API кілтінің атауы
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: kz.toidym.toidym
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Build IPA for App Store
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
